name: fetch

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    # Upstream public repo is scripts-only; run sync on forks / private data repos.
    if: github.repository != 'viazure/life-archive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch archives
        uses: ./.github/actions/fetch
        env:
          NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
          LISTENBRAINZ_USER: ${{ vars.LISTENBRAINZ_USER }}
