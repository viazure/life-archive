name: fetch

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch NeoDB
        env:
          NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
        run: python scripts/neodb.py

      - name: Fetch Last.fm
        if: always()
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ vars.LASTFM_USER }}
        run: python scripts/lastfm.py

      - name: Fetch ListenBrainz
        if: always()
        env:
          LISTENBRAINZ_USER: ${{ vars.LISTENBRAINZ_USER }}
        run: python scripts/listenbrainz.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/neodb data/lastfm data/listenbrainz
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "$(python scripts/commit_message.py fetch)"
            git push
          fi
