name: CI

on: [push, pull_request]

jobs:
  python_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint tools
        run: pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check scripts

      - name: Lint with Ruff
        run: ruff check scripts

  no_private_data:
    if: github.repository == 'viazure/life-archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse tracked archives in data/
        run: |
          set -euo pipefail
          bad="$(git ls-files 'data' | grep -v '/\.gitkeep$' || true)"
          if [ -n "$bad" ]; then
            echo "tracked files under data/ must be .gitkeep only:"
            echo "$bad"
            exit 1
          fi
          if git ls-files | grep -E '\.(fit|tcx|gpx)$'; then
            echo "workout originals must not be tracked"
            exit 1
          fi
          if git ls-files 'data' | grep -E '\.json$'; then
            echo "archive JSON must not be tracked"
            exit 1
          fi
          echo "data/ is clean"
