name: sync garmin

# Sync code copied from running_page @ 54c7e24e91f7d1cdd098c951de91638ff7bd8243

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check Garmin secret
        id: garmin
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
        run: |
          if [ -z "$GARMIN_SECRET_STRING_CN" ]; then
            echo "GARMIN_SECRET_STRING_CN unset, skip garmin"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.garmin.outputs.configured == 'true'
        run: pip install -r requirements.txt

      - name: Install Cloudflare WARP
        if: steps.garmin.outputs.configured == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        if: steps.garmin.outputs.configured == 'true'
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          echo "WARP status:"
          warp-cli --accept-tos status
          echo "IP info:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|warp"

      - name: Cache sync workspace
        if: steps.garmin.outputs.configured == 'true'
        uses: actions/cache@v5
        with:
          path: |
            .cache/data.db
            .cache/activities.json
            .cache/imported.json
          key: workouts-db-${{ github.run_id }}
          restore-keys: |
            workouts-db-

      - name: Sync Garmin
        if: steps.garmin.outputs.configured == 'true'
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
        run: python vendor/run_page/garmin_sync.py "$GARMIN_SECRET_STRING_CN" --is-cn --fit

      - name: Export activities
        if: steps.garmin.outputs.configured == 'true'
        run: python scripts/export_activities.py

      - name: Commit workouts archive
        if: steps.garmin.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/workouts
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "$(python scripts/commit_message.py garmin)"
            git push
          fi
