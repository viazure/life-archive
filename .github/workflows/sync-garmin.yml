name: sync garmin

# Sync code copied from running_page @ 54c7e24e91f7d1cdd098c951de91638ff7bd8243

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync Garmin
        uses: ./.github/actions/sync-garmin
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
