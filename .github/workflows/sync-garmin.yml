name: sync garmin

# Sync code copied from running_page @ 20a9d343601f06df320b5efa9bff498255183a1b

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Upstream public repo is scripts-only; run sync on forks / private data repos.
    if: github.repository != 'viazure/life-archive'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync Garmin
        uses: ./.github/actions/sync-garmin
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
